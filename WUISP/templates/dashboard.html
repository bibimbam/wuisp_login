<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #f0f2f5; text-align: center; }
        .dashboard-box { padding: 40px; background-color: #ffffff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .btn { display: inline-block; padding: 12px 24px; margin-top: 20px; text-align: center; text-decoration: none; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="dashboard-box">
        <h1>대시보드에 오신 것을 환영합니다!</h1>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">로그아웃</a>
    </div>
</body>
</html>
